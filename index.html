<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шахматка</title>
<style>
:root {
  --bg:#f0f2f5;--bg2:#ffffff;--bg3:#f7f8fa;
  --brd:#e2e5eb;--brd2:#c8cdd8;
  --ink:#1a1d24;--ink2:#5a6070;--ink3:#9aa0b0;
  --acc:#2563eb;--r:6px;
  --mono:'SF Mono','Fira Mono',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.topbar{display:flex;align-items:center;gap:10px;padding:0 16px;height:48px;background:var(--bg2);border-bottom:1px solid var(--brd);flex-shrink:0;}
.logo{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;}
.logo-badge{background:var(--acc);color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;}
.sep{width:1px;height:18px;background:var(--brd2);flex-shrink:0;}
.btn{padding:5px 12px;border-radius:var(--r);border:1px solid var(--brd2);background:var(--bg3);color:var(--ink2);font-family:var(--sans);font-size:12px;font-weight:500;cursor:pointer;transition:all .12s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
.btn:hover{border-color:var(--acc);color:var(--acc);}
.btn-pri{background:var(--acc);border-color:var(--acc);color:#fff;}
.btn-pri:hover{background:#1d4ed8;color:#fff;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ink3);flex-shrink:0;}
.sync-dot.ok{background:#22c55e;}.sync-dot.err{background:#ef4444;}.sync-dot.spin{background:#f59e0b;animation:pulse .8s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.sync-txt{font-size:11px;color:var(--ink3);}
.sync-txt.ok{color:#16a34a;}.sync-txt.err{color:#ef4444;}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
#userArea{display:flex;align-items:center;gap:6px;}
.name-inp{padding:5px 9px;background:var(--bg3);border:1px solid var(--brd2);border-radius:var(--r);color:var(--ink);font-family:var(--sans);font-size:12px;outline:none;width:130px;}
.name-inp:focus{border-color:var(--acc);}
.user-badge{font-size:11px;color:var(--ink2);white-space:nowrap;}
.user-badge b{color:var(--ink);}
.chips{display:flex;gap:4px;flex-wrap:wrap;}
.chip{padding:3px 10px;border-radius:14px;font-size:11px;font-weight:500;border:1px solid var(--brd2);background:var(--bg3);color:var(--ink3);cursor:pointer;transition:all .1s;}
.chip:hover{border-color:var(--acc);color:var(--acc);}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;}
.lang-chips .chip{padding:2px 7px;font-size:10px;font-weight:700;letter-spacing:.04em;}
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 16px;background:var(--bg2);border-bottom:1px solid var(--brd);flex-shrink:0;}
.fl{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;}
.fsel{padding:4px 8px;border-radius:var(--r);border:1px solid var(--brd2);background:var(--bg3);color:var(--ink2);font-size:11px;font-family:var(--sans);outline:none;cursor:pointer;}
.fsel:focus{border-color:var(--acc);}
/* Мультиселект-фильтр: кнопка + выпадающая панель с галочками */
.msel{position:relative;display:inline-block;}
.msel-btn{padding:4px 8px;border-radius:var(--r);border:1px solid var(--brd2);background:var(--bg3);color:var(--ink2);font-size:11px;font-family:var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:5px;max-width:185px;}
.msel-btn:hover{border-color:var(--acc);}
.msel-btn .mtxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.msel-btn .cnt{background:var(--acc);color:#fff;border-radius:8px;padding:0 5px;font-size:9px;font-weight:700;flex-shrink:0;}
.msel-pop{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:300;background:var(--bg2);border:1px solid var(--brd2);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:6px;max-height:280px;overflow:auto;min-width:160px;}
.msel.open .msel-pop{display:block;}
.msel-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2);padding:3px 6px;cursor:pointer;border-radius:4px;white-space:nowrap;}
.msel-item:hover{background:var(--bg3);}
.msel-item input{accent-color:var(--acc);margin:0;width:13px;height:13px;flex-shrink:0;}
.msel-all{border-bottom:1px solid var(--brd);margin-bottom:4px;padding-bottom:5px;font-weight:600;}
/* Подпись работы в строке (на секцию / на площадку): переносится, не обрывается */
.rh-work{font-size:8.5px;line-height:1.25;white-space:normal;word-break:break-word;color:var(--ink2);max-width:72px;text-align:left;}

/* Под-таблицы режима «По виду работ»: работы на секцию и на площадку */
.sub-board{border-collapse:separate;border-spacing:0;margin:14px 0 0 0;background:var(--bg2);}
.sub-board th.corner2{position:sticky;left:0;z-index:10;background:var(--bg2);font-size:9px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.4px;padding:5px 8px;border-right:2px solid var(--brd2);border-bottom:2px solid var(--brd2);text-align:left;min-width:64px;max-width:110px;white-space:normal;}
.sub-board th.h-work{border-bottom:2px solid var(--brd2);}
.sub-board td.rh{font-size:9px;}

/* ── Диаграмма Ганта ── */
#ganttWrap{min-width:max-content;}
/* ── Диаграмма Ганта ── */
.g-ctrl{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:11px;color:var(--ink3);position:sticky;left:0;}
.g-ctrl input[type=range]{width:140px;accent-color:var(--acc);}
.g-hdr{display:flex;position:sticky;top:0;z-index:8;background:var(--bg1);}
.g-hside{position:sticky;left:0;z-index:9;background:var(--bg1);flex:0 0 232px;border-right:2px solid var(--brd2);border-bottom:2px solid var(--brd2);}
.g-months{display:flex;border-bottom:2px solid var(--brd2);}
.g-m{flex-shrink:0;font-size:9px;color:var(--ink3);border-left:1px solid var(--brd);padding:3px 0 3px 4px;white-space:nowrap;overflow:hidden;background:var(--bg1);}
.g-body{position:relative;}
.g-gridlayer{position:absolute;top:0;bottom:0;left:232px;pointer-events:none;z-index:0;}
.g-gl{position:absolute;top:0;bottom:0;border-left:1px solid var(--brd);}
.g-today{position:absolute;top:0;bottom:0;border-left:2px solid #e03131;opacity:.65;}
.g-row{display:flex;align-items:center;height:28px;position:relative;}
.g-row.child{height:23px;}
.g-row:hover .g-lane{background:rgba(0,0,0,.022);}
.g-side{position:sticky;left:0;z-index:5;background:var(--bg1);flex:0 0 232px;height:100%;display:flex;align-items:center;gap:5px;padding:0 8px;border-right:2px solid var(--brd2);border-bottom:1px solid var(--brd);font-size:11px;color:var(--ink1);overflow:hidden;}
.g-row.parent .g-side{cursor:pointer;font-weight:600;}
.g-row.child  .g-side{font-size:10px;color:var(--ink2);padding-left:24px;font-weight:400;}
.g-caret{flex-shrink:0;width:10px;color:var(--ink3);font-size:9px;}
.g-wdot{flex-shrink:0;width:8px;height:8px;border-radius:2px;}
.g-sname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.g-cnt{flex-shrink:0;font-size:9px;color:var(--ink3);}
.g-lane{position:relative;height:100%;border-bottom:1px solid var(--brd);flex-shrink:0;}
.g-bar{position:absolute;top:50%;transform:translateY(-50%);height:14px;border-radius:7px;background:#e3e5e9;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07);}
.g-row.child .g-bar{height:11px;border-radius:6px;}
.g-bar.clk{cursor:pointer;}
.g-bar.clk:hover{box-shadow:inset 0 0 0 1px var(--acc);}
.g-fill{position:absolute;top:0;left:0;bottom:0;}
.g-pct{position:absolute;top:50%;transform:translateY(-50%);font-size:9px;color:var(--ink3);white-space:nowrap;}
.g-nodata{font-size:9px;color:var(--ink3);position:absolute;top:50%;transform:translateY(-50%);}
.gt-toolbar{display:flex;gap:8px;align-items:center;padding:7px 12px;font-size:11px;color:var(--ink3);position:sticky;left:0;}
.gt-toolbar input[type=range]{width:130px;accent-color:var(--acc);}
.gt-head{display:flex;position:sticky;top:0;z-index:30;background:var(--bg2);border-bottom:2px solid var(--brd2);}
.gt-row{display:flex;border-bottom:1px solid var(--brd);background:var(--bg2);}
.gt-row.parent{background:var(--bg3);}
.gt-label{position:sticky;left:0;z-index:20;background:inherit;width:230px;min-width:230px;max-width:230px;padding:3px 8px;font-size:11px;color:var(--ink2);border-right:2px solid var(--brd2);display:flex;align-items:center;gap:6px;overflow:hidden;}
.gt-label .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gt-label .tw{width:11px;flex-shrink:0;font-size:9px;color:var(--ink3);}
.gt-row.parent .gt-label{cursor:pointer;font-weight:600;color:var(--ink);}
.gt-label .clrdot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.gt-canvas{position:relative;height:24px;flex:0 0 auto;}
.gt-head .gt-canvas{height:26px;}
.gt-month{position:absolute;top:0;bottom:0;border-left:1px solid var(--brd);font-size:9px;color:var(--ink3);padding:2px 0 0 3px;white-space:nowrap;overflow:hidden;}
.gt-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--brd);opacity:.55;}
.gt-today{position:absolute;top:0;bottom:0;border-left:2px solid #e03131;z-index:6;}
.gt-bar{position:absolute;top:5px;height:14px;border-radius:4px;background:#e3e7eb;cursor:pointer;z-index:5;min-width:3px;}
.gt-bar .gt-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px 0 0 4px;}
.gt-bar.late{box-shadow:0 0 0 1px #e0313188;}
.gt-bar.parentbar{cursor:pointer;opacity:.92;height:9px;top:8px;border-radius:3px;}
.gt-devtxt{position:absolute;top:5px;font-size:8.5px;font-weight:700;color:#c92a2a;white-space:nowrap;z-index:5;}
.gt-pcttxt{position:absolute;top:6px;font-size:8.5px;color:var(--ink3);white-space:nowrap;z-index:5;}
.prog-wrap{display:flex;gap:12px;flex-wrap:wrap;padding:5px 16px;background:var(--bg2);border-bottom:1px solid var(--brd);flex-shrink:0;}
.prog-item{display:flex;align-items:center;gap:6px;}
.prog-lbl{font-size:10px;color:var(--ink2);white-space:nowrap;}
.prog-bar{width:72px;height:5px;background:var(--bg);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;transition:width .3s;background:rgba(34,197,94,0.5);}
.prog-pct{font-family:var(--mono);font-size:10px;color:var(--ink2);min-width:28px;}
.board-wrap{flex:1;overflow:auto;position:relative;}
.board-wrap::-webkit-scrollbar{width:5px;height:5px;}
.board-wrap::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px;}
.loader{display:none;position:absolute;inset:0;background:rgba(240,242,245,.9);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:10px;}
.loader.on{display:flex;}
.spin{width:28px;height:28px;border:2px solid var(--brd2);border-top-color:var(--acc);border-radius:50%;animation:rot .6s linear infinite;}
@keyframes rot{to{transform:rotate(360deg)}}
.loader-txt{font-size:12px;color:var(--ink2);}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:80px 24px;color:var(--ink3);}
.empty-ico{font-size:36px;opacity:.2;}
.empty-ttl{font-size:14px;font-weight:500;color:var(--ink2);}
table{border-collapse:separate;border-spacing:0;min-width:max-content;}
thead{position:sticky;top:0;z-index:50;}
th.corner{position:sticky;left:0;top:0;z-index:60;background:var(--bg2);min-width:64px;border-right:2px solid var(--brd2);border-bottom:2px solid var(--brd2);text-align:center;padding:4px;}
.corner-lbl{font-family:var(--mono);font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;}
th.h-section{background:var(--bg3);font-family:var(--mono);font-size:11px;font-weight:700;color:var(--acc);text-align:center;padding:4px 8px;border-bottom:1px solid var(--brd2);border-right:1px solid var(--brd);}
th.h-work{background:var(--bg2);font-size:10px;font-weight:600;color:var(--ink);text-align:center;padding:5px 4px;border-bottom:2px solid var(--brd2);border-right:1px solid var(--brd);width:82px;min-width:82px;white-space:normal;word-break:break-word;line-height:1.2;vertical-align:middle;}
th.h-gap{background:var(--bg3);width:10px;min-width:10px;border-bottom:2px solid var(--brd2);border-right:2px solid var(--brd2);}
td.rh{position:sticky;left:0;z-index:10;background:var(--bg2);min-width:64px;border-right:2px solid var(--brd2);border-bottom:1px solid var(--brd);text-align:center;vertical-align:middle;padding:0;}
.rh-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;height:44px;}
.rh-num{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink);}
.rh-lbl{font-size:8px;color:var(--ink3);text-transform:uppercase;}
td.rh.group-hdr{background:var(--bg3);text-align:left;padding:4px 8px;font-size:10px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;border-top:2px solid var(--brd2);}
td.cell{border-right:1px solid var(--brd);border-bottom:1px solid var(--brd);width:82px;min-width:82px;height:44px;padding:2px;vertical-align:middle;cursor:pointer;position:relative;transition:filter .1s;}
td.cell .ci{background:#fcfcfd;border:1px solid #d4d8e0;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);overflow:hidden;}
/* Завершённая работа (100%): весь текст серый, как метки этажа/секции */
td.cell.done .c-pct{color:#9ca3af;}
td.cell.done .c-date{color:#9ca3af;}
td.cell:hover{filter:brightness(.88);}
td.cell.na{background:#e9eaec !important;cursor:default;pointer-events:none;}
td.gap-col{background:var(--bg3);width:10px;min-width:10px;border-right:2px solid var(--brd2);border-bottom:1px solid var(--brd);cursor:default;}
.ci{width:100%;height:100%;padding:3px 4px 6px 4px;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:1;}
.ci-top{display:flex;justify-content:space-between;align-items:flex-start;gap:2px;}
.ci-bot{display:flex;justify-content:space-between;align-items:flex-end;}
.c-pct{font-family:var(--mono);font-size:11px;font-weight:400;line-height:1;color:#374151;white-space:nowrap;}
.c-pct.empty{color:#d1d5db;}
.c-date{font-size:9px;line-height:1;color:#9ca3af;font-family:var(--mono);white-space:nowrap;}
.c-topright{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.c-dev{font-size:9px;line-height:1;font-family:var(--mono);font-weight:600;white-space:nowrap;}
.c-dev.late{color:#dc2626;}
.c-dev.ahead{color:#16a34a;}
.c-target{font-size:9px;line-height:1;font-family:var(--mono);font-weight:600;color:#2563eb;white-space:nowrap;}
/* Затемнение нерелевантных работ в режиме «к дате» */
td.cell.dim .ci{opacity:.35;filter:grayscale(.8);}
/* Панель «Что показывать» */
.vp-item{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);cursor:pointer;padding:3px 9px;border:1px solid var(--brd2);border-radius:14px;background:var(--bg3);user-select:none;}
.vp-item input{accent-color:var(--acc);margin:0;width:13px;height:13px;}
.c-sec{font-size:9px;line-height:1;color:#9ca3af;white-space:nowrap;}
.c-fl{font-size:9px;line-height:1;color:#9ca3af;font-family:var(--mono);white-space:nowrap;}
.c-bar-track{position:absolute;bottom:0;left:0;right:0;height:3px;background:#f3f4f6;}
.c-bar-fill{position:absolute;bottom:0;left:0;height:3px;transition:width .3s;}
.stb{display:flex;align-items:center;padding:0 16px;height:26px;background:var(--bg2);border-top:1px solid var(--brd);flex-shrink:0;font-size:10px;color:var(--ink3);}
.si{display:flex;align-items:center;gap:4px;padding:0 10px;border-right:1px solid var(--brd);height:100%;}
.si:first-child{padding-left:0;}
.sn{font-family:var(--mono);font-size:12px;font-weight:700;}
.hint{margin-left:auto;font-size:10px;color:var(--ink3);}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;align-items:center;justify-content:center;}
.overlay.on{display:flex;}
.modal{background:var(--bg2);border-radius:12px;border:1px solid var(--brd2);width:340px;max-width:96vw;box-shadow:0 8px 32px rgba(0,0,0,.18);overflow:hidden;}
.mo-head{padding:14px 16px 10px;border-bottom:1px solid var(--brd);}
.mo-title{font-size:14px;font-weight:600;color:var(--ink);}
.mo-sub{font-size:11px;color:var(--ink3);margin-top:2px;}
.mo-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
.fg{display:flex;flex-direction:column;gap:6px;}
.fg-lbl{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;}
.pct-row{display:flex;align-items:center;gap:10px;}
.pct-sl{flex:1;-webkit-appearance:none;height:4px;background:var(--brd2);border-radius:2px;outline:none;cursor:pointer;}
.pct-sl::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--acc);border:2px solid #fff;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2);}
.pct-big{font-family:var(--mono);font-size:24px;font-weight:800;color:var(--ink);min-width:56px;text-align:right;}
.pct-btns{display:flex;gap:4px;flex-wrap:wrap;}
.pct-b{padding:4px 9px;border-radius:4px;border:1px solid var(--brd2);background:var(--bg3);color:var(--ink2);font-family:var(--mono);font-size:12px;cursor:pointer;transition:all .09s;}
.pct-b:hover{border-color:var(--acc);color:var(--acc);}
.ro-note{font-size:11px;color:var(--ink3);font-style:italic;}
.mo-foot{padding:10px 16px 14px;border-top:1px solid var(--brd);display:flex;gap:8px;justify-content:flex-end;}
.toasts{position:fixed;bottom:24px;right:16px;z-index:999;display:flex;flex-direction:column;gap:4px;pointer-events:none;}
.toast{padding:8px 14px;border-radius:var(--r);font-size:12px;font-weight:500;animation:tIn .15s ease;max-width:300px;}
@keyframes tIn{from{transform:translateX(10px);opacity:0}to{transform:none;opacity:1}}
.toast.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;}
.toast.err{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;}
.toast.inf{background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;}

/* ── Адаптив под телефон ─────────────────────────────────────── */
@media (max-width: 720px){
  body{height:auto;min-height:100vh;overflow:visible;}  /* скроллится вся страница */
  .topbar{height:auto;flex-wrap:wrap;gap:6px 8px;padding:8px 10px;}
  .topbar .sep{display:none;}
  .tb-right{margin-left:0;width:100%;flex-wrap:wrap;gap:6px;}
  #userArea{order:-1;width:100%;}
  .name-inp{flex:1;width:auto;min-width:0;}
  .logo{flex:1;}
  .filterbar{gap:6px;padding:8px 10px;}
  .filterbar .sep{display:none;}
  .filterbar .fl{display:none;}            /* подписи Секция:/Этаж: скрыты — компактнее */
  #secChips{width:100%;}
  .fsel{flex:1;min-width:90px;}
  .legend{flex-wrap:wrap;}
  .prog-wrap{gap:8px 12px;}
  /* Таблица не скроллится отдельно — горизонталь уходит в скролл всей
     страницы, а thead (sticky top:0) прилипает к верху ЭКРАНА, когда
     топбар и фильтры уже уехали вверх. */
  .board-wrap{flex:none;max-height:none;overflow:visible;}
  .stb{flex-wrap:wrap;height:auto;padding:6px 10px;gap:2px 0;}
  .stb .hint{display:none;}
  .modal{width:94vw;}
  /* Непрозрачный фон шапки — строки не просвечивают под ней при скролле */
  th.h-section{background:#f7f8fa;}
  th.h-work{background:#ffffff;}

<script>
const API = 'https://script.google.com/macros/s/AKfycbzEXg-pV4xOZmZ0uEmlcrJwbf3L9yCxkHkS9G_Tvm8omk6d3q24iyClcKFWcZ7-FjfXVw/exec';

// ── ЦВЕТ полоски ─────────────────────────────────────────────────
// Запасной вариант (нет данных об отставании): по проценту
// 0% → серый трек, 1–99% → красный→жёлтый, 100% → зелёный
function barColor(pct) {
  if (pct === 0)   return null;
  if (pct === 100) return '#2f9e44';
  const hue = Math.round((pct / 99) * 60);
  return `hsl(${hue},${pct < 50 ? 75 : 78}%,${pct < 50 ? 50 : 43}%)`;
}

// ── ЦВЕТ по отставанию ───────────────────────────────────────────
// 1 день — уже жёлтый (hue 50), 30+ дней — красный (hue 0)
function devHue(dev){
  const x = Math.min(Math.max(dev,1),30);
  return Math.round(50 * (1 - (x-1)/29));
}
// Цвет полоски: приоритет — отставание; нет данных — по проценту
function cellBarColor(d){
  if (d.pct === 100) return '#2f9e44';
  if (d.dev !== null){
    if (d.dev > 0) return `hsl(${devHue(d.dev)},80%,45%)`;
    return '#2f9e44';                       // в графике / опережение
  }
  return barColor(d.pct);
}
// Заливка всей карточки. Не начали и отставания нет — не красим.
function cellTint(d){
  if (d.pct === 100 || d.dev === null) return '';
  if (d.dev > 0)  return `hsl(${devHue(d.dev)},75%,93%)`;   // отстаёт
  if (d.pct > 0)  return 'hsl(140,45%,94%)';                // идёт в графике
  return '';                                                 // не начата, не отстаёт
}

// Метки секции/этажа по языку
const SEC_LBL = { ru:'с', sr:'s', en:'s' };
const FL_LBL  = { ru:'э', sr:'sp', en:'fl' };
const DAY_LBL = { ru:'д', sr:'d', en:'d' };   // суффикс дней в отставании

// ── Цвет колонки работы: фон ячейки «Вид работ» в Google-таблице ──
function workColor(name){
  const w = CONFIG.works.find(x=>String(x['Вид работ'])===String(name));
  const c = w && String(w['Цвет']||'').trim();
  return (c && /^#[0-9a-f]{6}$/i.test(c)) ? c : '';
}
function hexA(hex,a){   // #rrggbb -> rgba(r,g,b,a)
  const n=parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
// Подчёркивание названия работы в шапке полосой её цвета
function thWork(w){
  const c=workColor(w['Вид работ']);
  return `<th class="h-work"${c?` style="box-shadow:inset 0 -3px 0 ${c}"`:''}>${esc(workLabel(w))}</th>`;
}

// Перевод названия работы ТОЛЬКО для отображения.
// В базу и в ключ всегда уходит русское w['Вид работ'].
// Колонки в «Списке работ»: «Вид работ SR», «Вид работ EN».
function workLabel(w){
  if(CURRENT_LANG==='sr' && String(w['Вид работ SR']||'').trim()) return String(w['Вид работ SR']).trim();
  if(CURRENT_LANG==='en' && String(w['Вид работ EN']||'').trim()) return String(w['Вид работ EN']).trim();
  return w['Вид работ'];
}
// Перевод названия группы (колонки «Группа работ SR/EN»)
function groupLabel(g){
  const w = CONFIG.works.find(x=>String(x['Группа работ']||'').trim()===g);
  if(w){
    if(CURRENT_LANG==='sr' && String(w['Группа работ SR']||'').trim()) return String(w['Группа работ SR']).trim();
    if(CURRENT_LANG==='en' && String(w['Группа работ EN']||'').trim()) return String(w['Группа работ EN']).trim();
  }
  return g;
}

// ── ЯЗЫК ─────────────────────────────────────────────────────────
let CURRENT_LANG = 'ru';
function t(key){ return (LANG[CURRENT_LANG]&&LANG[CURRENT_LANG][key]) ? LANG[CURRENT_LANG][key] : key; }

function setLang(lang){
  CURRENT_LANG = lang;
  localStorage.setItem('shk_lang', lang);
  ['ru','sr','en'].forEach(l => document.getElementById('lang-'+l).classList.toggle('on', l===lang));
  applyLang();
  render();
}

function applyLang(){
  document.getElementById('ui-title').textContent      = t('title');
  document.getElementById('ui-refresh').textContent    = t('refresh');
  document.getElementById('mode-sec').textContent      = t('bySection');
  document.getElementById('mode-work').textContent     = t('byWork');
  document.getElementById('mode-gantt').textContent    = t('byGantt');
  document.getElementById('mode-sum').textContent      = t('bySummary');
  document.getElementById('ui-deadlineLbl').textContent= t('deadlineLbl');
  document.getElementById('ui-showBtn').textContent    = t('showBtn');
  document.getElementById('ui-sectionLbl').textContent = t('sectionLbl');
  document.getElementById('ui-cutLbl').textContent     = t('cutLbl');
  document.getElementById('ui-groupLbl').textContent   = t('groupLbl');
  document.getElementById('ui-workLbl').textContent    = t('workLbl');
  document.getElementById('ui-pctLabel').textContent   = t('pctLabel');
  document.getElementById('ui-cancel').textContent     = t('cancel');
  document.getElementById('saveBtn').textContent       = t('save');
  document.getElementById('ui-total').textContent      = t('total');
  document.getElementById('ui-done').textContent       = t('done');
  document.getElementById('ui-inProg').textContent     = t('inProg');
  document.getElementById('ui-loading').textContent    = t('loading');
  document.getElementById('ui-hint').textContent       = t('hint');
  document.title = t('title');
  rebuildSecChips();        // чипы секций тоже перестраиваются при смене языка
  rebuildCutFilter();
  rebuildGroupFilter();
  rebuildWorkFilter();
  buildViewPanel();
  renderUserArea();
}

// ── ДАННЫЕ / СОСТОЯНИЕ ───────────────────────────────────────────
let CONFIG = { works:[], sections:[] };
let DATA   = {};
let SUMMARY= [];
let MODE   = 'section';
// «Что показывать» в ячейке (галочки), хранится в localStorage
let SHOW = { pct:true, dstart:false, dend:true, dev:true, sec:true, fl:true };
try{ const s=JSON.parse(localStorage.getItem('shk_show')||'null'); if(s) SHOW=Object.assign(SHOW,s);}catch(e){}
let DEADLINE = null;   // режим «к дате»: Date или null
let FILTER_SEC   = new Set();
let FILTER_CUT   = new Set();   // «Разрез»: номера этажей (строки), '__sec__', '__site__'; пусто = всё
let FILTER_WORK  = new Set();   // выбранные виды работ (русские ID); пусто = все
let FILTER_GROUP = new Set();   // выбранные группы; пусто = все
let CUR    = null;
let userName  = '';
let USER      = null;    // {name, role, sections} после входа по паролю
let OPEN_MODE = false;   // true, если в таблице нет листа «Роли» — доступ всем

// ── INIT ─────────────────────────────────────────────────────────
window.onload = async () => {
  CURRENT_LANG = localStorage.getItem('shk_lang') || 'ru';
  userName = localStorage.getItem('shk_name') || '';
  ['ru','sr','en'].forEach(l => document.getElementById('lang-'+l).classList.toggle('on', l===CURRENT_LANG));
  applyLang();
  initDelegation();
  await Promise.all([initAuth(), loadAll()]);
};
function saveName(v){ userName=v.trim(); localStorage.setItem('shk_name',userName); }

// Делегирование кликов: ячейки и чипы секций без inline-onclick —
// названия работ с кавычками/апострофами больше ничего не ломают
function initDelegation(){
  document.getElementById('board').addEventListener('click', e => {
    const td = e.target.closest('td.cell');
    if(!td || td.classList.contains('na')) return;
    openModal(td.dataset.sec, td.dataset.floor, td.dataset.work);
  });
  document.getElementById('secChips').addEventListener('click', e => {
    const c = e.target.closest('.chip');
    if(!c) return;
    const v = c.dataset.sec;
    if(v === '') FILTER_SEC.clear();
    else FILTER_SEC.has(v) ? FILTER_SEC.delete(v) : FILTER_SEC.add(v);
    rebuildSecChips();
    render();
  });
}

// ── АВТОРИЗАЦИЯ ──────────────────────────────────────────────────
async function tryLogin(pass){
  const r = await fetch(API+'?action=login&pass='+encodeURIComponent(pass||'')+'&t='+Date.now());
  return r.json();
}

async function initAuth(){
  try {
    const pass = localStorage.getItem('shk_pass') || '';
    const j = await tryLogin(pass);
    if(j.open){ OPEN_MODE = true; USER = null; }
    else if(j.name){ USER = j; }
    else { USER = null; if(pass) localStorage.removeItem('shk_pass'); }
  } catch(e){ USER = null; }
  renderUserArea();
}

async function doLogin(){
  const inp = document.getElementById('passInp');
  const pass = (inp && inp.value || '').trim();
  if(!pass) return;
  try {
    const j = await tryLogin(pass);
    if(j.error || !j.name){ toast(t('wrongPass'),'err'); return; }
    localStorage.setItem('shk_pass', pass);
    USER = j;
    renderUserArea();
    toast('👤 '+j.name,'ok');
  } catch(e){ toast(t('errorSave'),'err'); }
}

function logout(){
  localStorage.removeItem('shk_pass');
  USER = null;
  renderUserArea();
}

// Может ли пользователь редактировать данную работу на данной секции.
// Ограничения по секциям и по видам работ ПЕРЕСЕКАЮТСЯ (логика И):
// «Секции: 1» + «Вид работ: Монолит» = только монолит на секции 1.
// Пустое поле = без ограничения.
function canEdit(sec, work){
  if(OPEN_MODE) return true;
  if(!USER) return false;
  if(String(USER.role||'').trim().toLowerCase() === 'читатель') return false;

  const inList = (raw, val) => {
    const s = String(raw||'').trim();
    if(s === '') return true;
    const low = s.toLowerCase();
    if(low === 'все' || low === 'sve' || low === 'all') return true;
    return s.split(',').map(x=>x.trim()).includes(String(val).trim());
  };

  if(!inList(USER.sections, sec))  return false;
  if(!inList(USER.works,    work)) return false;
  return true;
}

function renderUserArea(){
  const el = document.getElementById('userArea');
  if(!el) return;
  if(OPEN_MODE){
    el.innerHTML = `<span style="font-size:11px;color:var(--ink3);">👤</span>
      <input class="name-inp" id="nameInp" placeholder="${esc(t('yourName'))}" value="${esc(userName)}" oninput="saveName(this.value)">`;
  } else if(USER){
    el.innerHTML = `<span class="user-badge">👤 <b>${esc(USER.name)}</b>${USER.role?' · '+esc(USER.role):''}</span>
      <button class="btn" onclick="logout()">${esc(t('logout'))}</button>`;
  } else {
    el.innerHTML = `<input class="name-inp" id="passInp" type="password" placeholder="${esc(t('passHolder'))}"
        onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn btn-pri" onclick="doLogin()">${esc(t('login'))}</button>`;
  }
}

// ── LOAD ─────────────────────────────────────────────────────────
async function loadAll(){
  setSt('spin',t('loading')); showLoader(t('loadingSheets'));
  try {
    const [cfgRes, dataRes, sumRes] = await Promise.all([
      fetch(API+'?action=config&t='+Date.now()),
      fetch(API+'?action=data&t='+Date.now()),
      fetch(API+'?action=summary&t='+Date.now())
    ]);
    const cfg = await cfgRes.json();
    const dat = await dataRes.json();
    let   sum = {rows:[]};
    try{ sum = await sumRes.json(); }catch(e){}
    if(cfg.error) throw new Error(cfg.error);
    if(dat.error) throw new Error(dat.error);   // ошибка чтения базы больше не глотается
    SUMMARY = (sum && !sum.error && sum.rows) ? sum.rows : [];
    CONFIG.works    = cfg.works    || [];
    CONFIG.sections = cfg.sections || [];
    DATA = {};
    (dat.rows||[]).forEach(r => {
      const k = makeKey(r['Секция'], r['Этаж'], r['Вид работ']);
      DATA[k] = {
        found:    true,
        pct:      parseFloat(r['% выполнения'])||0,
        updatedAt:r['Обновлено'] ||'',
        startDate:normalizeDate(r['Дата начала']),
        planDate: normalizeDate(r['Дата план']),
        factDate: normalizeDate(r['Дата факт']),
        dev:      parseDev(r['Отставание'])
      };
    });
    buildFilters();
    render();
    setSt('ok', t('loaded')+' · '+new Date().toLocaleTimeString('ru'));
    toast(t('loaded'),'ok');
  } catch(e) {
    setSt('err',e.message);
    toast('Ошибка: '+e.message,'err',4000);
    document.getElementById('emptyState').style.display='flex';
    document.getElementById('board').style.display='none';
  }
  hideLoader();
}

// ── FILTERS ──────────────────────────────────────────────────────
function buildFilters(){
  rebuildSecChips();
  rebuildCutFilter();
  rebuildGroupFilter();
  rebuildWorkFilter();
}

// ── Мультиселект (кнопка + панель с галочками) ──────────────────
const MSEL = {};
function buildMsel(id, items, sel, allLabel, onChange){
  MSEL[id] = { items, sel, allLabel, onChange };
  renderMsel(id);
}
function renderMsel(id){
  const m = MSEL[id]; const el = document.getElementById(id);
  if(!m || !el) return;
  let btnTxt = m.allLabel;
  if(m.sel.size){
    const labs = m.items.filter(i=>m.sel.has(i.v)).map(i=>i.label);
    btnTxt = labs.length===1 ? labs[0] : labs[0]+' +'+(labs.length-1);
  }
  let h = `<button type="button" class="msel-btn" onclick="toggleMsel('${id}',event)">`+
          `<span class="mtxt">${esc(btnTxt)}</span>`+
          (m.sel.size?`<span class="cnt">${m.sel.size}</span>`:'')+`<span>▾</span></button>`+
          `<div class="msel-pop">`;
  h += `<label class="msel-item msel-all"><input type="checkbox" data-all="1"${m.sel.size===0?' checked':''}>${esc(m.allLabel)}</label>`;
  m.items.forEach((it,i)=>{
    h += `<label class="msel-item"><input type="checkbox" data-i="${i}"${m.sel.has(it.v)?' checked':''}>${esc(it.label)}</label>`;
  });
  el.innerHTML = h + '</div>';
  el.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      if(inp.dataset.all) m.sel.clear();
      else { const v=m.items[+inp.dataset.i].v; m.sel.has(v)?m.sel.delete(v):m.sel.add(v); }
      const wasOpen = el.classList.contains('open');
      renderMsel(id);
      if(wasOpen) el.classList.add('open');
      if(m.onChange) m.onChange();
    });
  });
}
function toggleMsel(id,e){
  e.stopPropagation();
  document.querySelectorAll('.msel.open').forEach(x=>{ if(x.id!==id) x.classList.remove('open'); });
  document.getElementById(id).classList.toggle('open');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.msel')) document.querySelectorAll('.msel.open').forEach(x=>x.classList.remove('open'));
});

// ── Хелперы фильтрации ───────────────────────────────────────────
function inGroup(w){
  if(FILTER_GROUP.size===0) return true;
  return FILTER_GROUP.has(String(w['Группа работ']||'').trim());
}
function workSelected(w){
  if(FILTER_WORK.size===0) return true;
  return FILTER_WORK.has(String(w['Вид работ']));
}
// «Разрез»: пусто = всё; иначе показываем только выбранные этажи/блоки
function floorVisible(f){ return FILTER_CUT.size===0 || FILTER_CUT.has(String(f)); }
function secBlockVisible(){ return FILTER_CUT.size===0 || FILTER_CUT.has('__sec__'); }
function siteBlockVisible(){ return FILTER_CUT.size===0 || FILTER_CUT.has('__site__'); }
function anyFloorsVisible(){
  return FILTER_CUT.size===0 || [...FILTER_CUT].some(v=>v!=='__sec__'&&v!=='__site__');
}

// ── «Разрез»: этажи + «На секцию» + «Площадка» ───────────────────
function rebuildCutFilter(){
  const floors = new Set();
  CONFIG.sections.forEach(s => {
    const above=parseInt(s['Этажи выше 0.000'])||0;
    const below=parseInt(s['Этажи ниже 0.000'])||0;
    for(let f=above;f>=1;f--)   floors.add(f);
    for(let f=-1;f>=-below;f--) floors.add(f);
  });
  const items = [...floors].sort((a,b)=>b-a).map(f=>({v:String(f), label:`${f} ${t('floorShort')}`}));
  items.push({v:'__sec__',  label:t('onSecOpt')});
  items.push({v:'__site__', label:t('onSiteOpt')});
  // выбор, которого больше нет (сменился конфиг) — выбрасываем
  const valid = new Set(items.map(i=>i.v));
  [...FILTER_CUT].forEach(v=>{ if(!valid.has(v)) FILTER_CUT.delete(v); });
  buildMsel('cutMs', items, FILTER_CUT, t('allCuts'), render);
}

function rebuildGroupFilter(){
  const seen = new Set(); const items=[];
  CONFIG.works.forEach(w => {
    const g = String(w['Группа работ']||'').trim();
    if(g && !seen.has(g)){ seen.add(g); items.push({v:g, label:groupLabel(g)}); }
  });
  [...FILTER_GROUP].forEach(v=>{ if(!seen.has(v)) FILTER_GROUP.delete(v); });
  buildMsel('groupMs', items, FILTER_GROUP, t('allGroups'), ()=>{
    // сужение групп выбрасывает работы, не входящие в выбранные группы
    if(FILTER_GROUP.size){
      [...FILTER_WORK].forEach(name=>{
        const w = CONFIG.works.find(x=>String(x['Вид работ'])===name);
        if(!w || !inGroup(w)) FILTER_WORK.delete(name);
      });
    }
    rebuildWorkFilter();
    render();
  });
}

// Вид работ: ВСЕ работы (поэтажные, на секцию, на площадку) выбранных групп
function rebuildWorkFilter(){
  const items = CONFIG.works.filter(inGroup)

// ── KEY / DATA ────────────────────────────────────────────────────
function makeKey(sec,floor,work){ return [String(sec||''),String(floor||''),String(work||'')].join('|||'); }
function getPct(sec,floor,work){ return DATA[makeKey(sec,floor,work)]?.pct||0; }
function getCell(sec,floor,work){ return DATA[makeKey(sec,floor,work)]||{found:false,pct:0,updatedAt:'',startDate:'',planDate:'',factDate:'',dev:null}; }
// «Отставание» из таблицы → число дней или null.
// Принимаем ТОЛЬКО чистое число (целое/дробное со знаком).
// Дата ("2026-06-15"), текст, пустое → null, чтобы не показывать мусор
// вроде "+2026д", если в ячейку случайно попала дата или формула.
function parseDev(v){
  if(v===null||v===undefined) return null;
  const s=String(v).trim().replace(',', '.');
  if(s==='') return null;
  if(!/^[+-]?\d+(\.\d+)?$/.test(s)) return null;
  const n=parseFloat(s);
  return isNaN(n)?null:n;
}

// ── DATE HELPERS ──────────────────────────────────────────────────
function normalizeDate(s){
  if(!s||s==='') return '';
  if(typeof s==='string'&&/^\d{2}\.\d{2}\.\d{4}/.test(s.trim())) return s.trim().slice(0,10);
  if(typeof s==='string'&&/^\d{4}-\d{2}-\d{2}/.test(s.trim())){
    const[y,m,d]=s.trim().slice(0,10).split('-');
    return `${d}.${m}.${y}`;
  }
  const num=parseFloat(s);
  if(!isNaN(num)&&num>40000&&num<60000){
    const date=new Date(new Date(1899,11,30).getTime()+Math.floor(num)*86400000);
    return String(date.getDate()).padStart(2,'0')+'.'+String(date.getMonth()+1).padStart(2,'0')+'.'+date.getFullYear();
  }
  return '';
}
function parseDate(s){
  if(!s) return null;
  const num = parseFloat(s);
  if(!isNaN(num) && num > 40000 && num < 60000){
    return new Date(new Date(1899,11,30).getTime() + Math.floor(num)*86400000);
  }
  s = String(s).trim();
  if(/^\d{2}\.\d{2}\.\d{4}/.test(s)){const[d,m,y]=s.slice(0,10).split('.');return new Date(+y,+m-1,+d);}
  if(/^\d{4}-\d{2}-\d{2}/.test(s)){const[y,m,d]=s.slice(0,10).split('-');return new Date(+y,+m-1,+d);}
  return null;
}
function fmtShort(s){
  const d=parseDate(s);if(!d)return'';
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');
}
// Отставание в днях (зарезервировано под плановые даты)
function devDays(s){
  const d=parseDate(s);if(!d)return null;
  const today=new Date();today.setHours(0,0,0,0);
  return Math.round((today-d)/(1000*60*60*24));
}

// ── CELL HTML ─────────────────────────────────────────────────────
function cellHtml(sec,floor,work,colspan){
  const d=getCell(sec,floor,work);
  const cs=colspan?` colspan="${colspan}"` :'';
  const isEmpty=d.pct===0;
  const isDone=d.pct===100;
  const bar=cellBarColor(d);
  const tint=d.found?cellTint(d):'';

  const sl=SEC_LBL[CURRENT_LANG]||'с';
  const fl=FL_LBL[CURRENT_LANG]||'э';
  const dy=DAY_LBL[CURRENT_LANG]||'д';

  // Даты (только если запись есть в базе). Подписи словами: «Старт dd.mm» / «Финиш dd.mm»
  const hasFactDate=!!d.factDate&&String(d.factDate).trim()!=='';
  const endStr=fmtShort(hasFactDate?d.factDate:d.planDate);
  const endLabel=(d.found&&SHOW.dend&&endStr)?(t('finishShort')+' '+(hasFactDate?'✓':'')+endStr):'';
  const startStr=fmtShort(d.startDate);
  const startLabel=(d.found&&SHOW.dstart&&startStr)?(t('startShort')+' '+startStr):'';

  // Отставание: и на ненaчатых тоже, если старт просрочен (dev>0)
  let devHtml='';
  if(SHOW.dev && d.found && !isDone && d.dev!==null && d.dev!==0){
    devHtml = d.dev>0
      ? `<div class="c-dev late">+${d.dev}${dy}</div>`
      : `<div class="c-dev ahead">${Math.abs(d.dev)}${dy}</div>`;
  }

  // Режим «к дате»: незавершённые работы, которые должны идти/закончиться
  // к выбранной дате — яркие, с целевым % (→78%); остальные затемняются.
  let dim=false, targetHtml='';
  if(DEADLINE){
    const sd=parseDate(d.startDate), ed=parseDate(d.planDate);
    const relevant = d.found && !isDone && sd && sd<=DEADLINE;
    if(relevant){
      // Длительность считается ВКЛЮЧАЯ последний день:
      // 09.06–24.06 = 16 рабочих дней; к 23.06 пройдено 15 → 94%.
      // 100% — только если дата окончания <= выбранной даты.
      const DAY=86400000;
      let target=100;
      if(ed && ed>sd){
        const total=Math.round((ed-sd)/DAY)+1;          // дней всего, включительно
        const done =Math.floor((DEADLINE-sd)/DAY)+1;    // дней к дате, включительно
        if(done<total) target=Math.max(0,Math.min(99,Math.round(done/total*100)));
      }
      targetHtml=`<div class="c-target">→${target}%</div>`;
    } else dim=true;
  }

  const trParts=[startLabel?`<div class="c-date">${esc(startLabel)}</div>`:'',
                 endLabel?`<div class="c-date">${esc(endLabel)}</div>`:'',
                 devHtml, targetHtml].join('');
  const trEl = trParts ? `<div class="c-topright">${trParts}</div>` : '';

  const pctTxt = SHOW.pct ? (isEmpty?'—':d.pct+'%') : '';
  const topRow=`<div class="ci-top">
    <div class="c-pct${isEmpty?' empty':''}">${pctTxt}</div>
    ${trEl}
  </div>`;

  const showBot = (!isEmpty || (d.dev!==null&&d.dev>0)) && (SHOW.sec || SHOW.fl) && (String(sec)!==''||String(floor)!=='');
  const botRow=showBot?`<div class="ci-bot">
    ${(SHOW.sec&&String(sec)!=='')?`<div class="c-sec">${sl}${esc(String(sec))}</div>`:'<div></div>'}
    ${(SHOW.fl&&floor!=='')?`<div class="c-fl">${fl}${esc(String(floor))}</div>`:''}
  </div>`:'';

  const barHtml=`<div class="c-bar-track"></div>${bar&&!isEmpty?`<div class="c-bar-fill" style="width:${d.pct}%;background:${bar}"></div>`:''}`;

  // Фоновая подкраска столбца цветом работы (за карточкой)
  const wc=workColor(work);
  const tdStyle=wc?` style="background:${hexA(wc,0.13)}"`:'';

  return `<td class="cell${isDone?' done':''}${dim?' dim':''}" data-sec="${esc(String(sec))}" data-floor="${esc(String(floor))}" data-work="${esc(String(work))}"${cs}${tdStyle}>
    <div class="ci"${tint?` style="background:${tint}"`:''}>${topRow}${botRow}${barHtml}</div>
  </td>`;
}

// ── WORK APPLICABILITY ────────────────────────────────────────────
function isWorkApplicable(work,section,floor){
  const secRule=String(work['Наличие на секции']||'').trim();
  if(secRule&&secRule.toLowerCase()!=='все'){
    if(!secRule.split(',').map(s=>s.trim()).includes(String(section))) return false;
  }
  if(floor===null) return true;
  const floorRule=String(work['Наличие на этаже']||'').trim();
  if(!floorRule||floorRule.toLowerCase()==='все') return true;
  return floorRule.split(',').map(f=>parseInt(f.trim())).filter(f=>!isNaN(f)).includes(floor);
}

// ── ДИАГРАММА ГАНТА ──────────────────────────────────────────────
// Строка-родитель = вид работ (сворачивается), дети = этажи по возрастанию.
// Колбаска: трек = план (старт→финиш), заливка = % выполнения,
// цвет заливки — та же логика отставания, что у ячеек (cellBarColor).
let GANTT_PXD  = parseFloat(localStorage.getItem('shk_gpxd')) || 2.5;  // пикселей в дне
let GANTT_OPEN = new Set();      // развёрнутые виды работ
let GANTT_SCROLLED = false;      // авто-прокрутка к «сегодня» один раз

const G_MONTHS = {
  ru:['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'],
  sr:['jan','feb','mar','apr','maj','jun','jul','avg','sep','okt','nov','dec'],
  en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
};
const G_DAY = 86400000;

// Дети работы с учётом фильтров; этажи от наименьшего к наивысшему
function ganttChildren(w){
  const unit=String(w['Единица приемки']||'').trim();
  const out=[];
  if(unit==='Этаж секция'){
    if(!anyFloorsVisible()) return out;
    getSections().forEach(s=>{
      const sec=s['Секция'];
      const a=parseInt(s['Этажи выше 0.000'])||0, b=parseInt(s['Этажи ниже 0.000'])||0;
      const fls=[];
      for(let f=-b;f<=-1;f++) fls.push(f);
      for(let f=1;f<=a;f++)   fls.push(f);
      fls.forEach(f=>{
        if(!floorVisible(f)||!isWorkApplicable(w,sec,f)) return;
        out.push({sec:String(sec),floor:f,label:`${t('sectionPrefix')} ${sec} · ${f} ${t('floorShort')}`});
      });
    });
  } else if(unit==='Секция'){
    if(!secBlockVisible()) return out;
    getSections().forEach(s=>{
      if(isWorkApplicable(w,s['Секция'],null))
        out.push({sec:String(s['Секция']),floor:'',label:`${t('sectionPrefix')} ${s['Секция']}`});
    });
  } else if(unit==='Площадка'){
    if(!siteBlockVisible()) return out;
    out.push({sec:'',floor:'',label:t('onSiteOpt')});
  }
  return out;
}

// Агрегат по детям: интервал = min старт … max план, % = средний, отставание = худшее
function ganttAgg(w, kids){
  let start=null, plan=null, pctSum=0, n=0, dev=null;
  kids.forEach(k=>{
    const d=getCell(k.sec,k.floor,w['Вид работ']);
    k.d=d;
    const s=parseDate(d.startDate), p=parseDate(d.planDate);
    if(s&&(!start||s<start)) start=s;
    if(p&&(!plan ||p>plan))  plan=p;
    pctSum+=d.pct; n++;
    if(d.dev!==null && (dev===null||d.dev>dev)) dev=d.dev;
  });
  return {start, plan, pct:n?Math.round(pctSum/n):0, dev, n};
}

function ganttBar(x,wd,d,clkAttrs,isChild){
  const fill = d.pct>0 ? `<div class="g-fill" style="width:${d.pct}%;background:${cellBarColor(d)||'#94a3b8'}"></div>` : '';
  const tint = cellTint(d);
  const pctX = x+wd+6;
  return `<div class="g-bar${clkAttrs?' clk':''}"${clkAttrs||''} style="left:${x}px;width:${Math.max(wd,3)}px;${tint?`background:${tint};`:''}" title="${esc(fmtShort(d.startDate)||'')} → ${esc(fmtShort(d.factDate||d.planDate)||'')} · ${d.pct}%">${fill}</div>`+
         `<span class="g-pct" style="left:${pctX}px">${d.pct}%</span>`;
}

function renderGantt(gw){
  const works = CONFIG.works.filter(w=>inGroup(w)&&workSelected(w));
  const rows=[];   // {w, kids, agg}
  works.forEach(w=>{
    const kids=ganttChildren(w);
    if(!kids.length) return;
    rows.push({w, kids, agg:ganttAgg(w,kids)});
  });

  // Диапазон шкалы
  let min=null,max=null;
  rows.forEach(r=>{
    if(r.agg.start&&(!min||r.agg.start<min)) min=r.agg.start;
    if(r.agg.plan &&(!max||r.agg.plan >max)) max=r.agg.plan;
  });
  const today=new Date(); today.setHours(0,0,0,0);
  if(!min) min=new Date(today.getTime()-30*G_DAY);
  if(!max) max=new Date(today.getTime()+60*G_DAY);
  if(today<min) min=today;                                 // линия «сегодня» всегда на шкале
  if(today>max) max=new Date(today.getTime()+15*G_DAY);
  min=new Date(min.getFullYear(),min.getMonth(),1);                       // от начала месяца
  max=new Date(max.getFullYear(),max.getMonth()+1,15);                    // запас справа
  const pxd=GANTT_PXD;
  const X=d=>Math.round((d-min)/G_DAY*pxd);
  const totalW=X(max);

  // Шапка месяцев + сетка
  let months='', grid='';
  const mn=G_MONTHS[CURRENT_LANG]||G_MONTHS.ru;
  for(let d=new Date(min); d<max; d=new Date(d.getFullYear(),d.getMonth()+1,1)){
    const next=new Date(d.getFullYear(),d.getMonth()+1,1);
    const wpx=X(next>max?max:next)-X(d);
    months+=`<div class="g-m" style="width:${wpx}px">${wpx>26?`${mn[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`:''}</div>`;
    grid+=`<div class="g-gl" style="left:${X(d)}px"></div>`;
  }
  if(today>=min&&today<=max) grid+=`<div class="g-today" style="left:${X(today)}px"></div>`;

  let body='';
  rows.forEach(r=>{
    const open=GANTT_OPEN.has(r.w['Вид работ']);
    const single=r.kids.length===1;
    const wc=workColor(r.w['Вид работ']);
    const dot=wc?`<span class="g-wdot" style="background:${wc}"></span>`:'';
    // одиночные (площадка, одна секция) — сразу кликабельная колбаска без разворота
    const k0=single?r.kids[0]:null;
    const clk=single?` data-sec="${esc(k0.sec)}" data-floor="${esc(String(k0.floor))}" data-work="${esc(r.w['Вид работ'])}"`:'';
    let lane='';
    if(r.agg.start&&r.agg.plan){
      lane=ganttBar(X(r.agg.start),X(r.agg.plan)-X(r.agg.start),
        single?k0.d:{pct:r.agg.pct,dev:r.agg.dev,startDate:'',planDate:'',factDate:''},clk,false);
    } else lane=`<span class="g-nodata" style="left:6px">${t('noDates')}</span>`;
    body+=`<div class="g-row parent">
      <div class="g-side"${single?'':` data-toggle="${esc(r.w['Вид работ'])}"`}>
        <span class="g-caret">${single?'':(open?'▾':'▸')}</span>${dot}
        <span class="g-sname" title="${esc(workLabel(r.w))}">${esc(workLabel(r.w))}</span>
        ${single?'':`<span class="g-cnt">${r.kids.length}</span>`}
      </div>
      <div class="g-lane" style="width:${totalW}px">${lane}</div>
    </div>`;
    if(open&&!single){
      r.kids.forEach(k=>{
        const d=k.d, s=parseDate(d.startDate), p=parseDate(d.factDate)||parseDate(d.planDate);
        let lane2='';
        if(s&&p&&p>s) lane2=ganttBar(X(s),X(p)-X(s),d,
          ` data-sec="${esc(k.sec)}" data-floor="${esc(String(k.floor))}" data-work="${esc(r.w['Вид работ'])}"`,true);
        else lane2=`<span class="g-nodata" style="left:6px">${t('noDates')}</span>`;
        body+=`<div class="g-row child">
          <div class="g-side">${esc(k.label)}</div>
          <div class="g-lane" style="width:${totalW}px">${lane2}</div>
        </div>`;
      });
    }
  });

  gw.innerHTML=`
    <div class="g-ctrl">${t('scaleLbl')} <input type="range" min="1" max="14" step="0.5" value="${pxd}" id="gZoom"></div>
    <div class="g-hdr"><div class="g-hside"></div><div class="g-months" style="width:${totalW}px">${months}</div></div>
    <div class="g-body">
      <div class="g-gridlayer" style="width:${totalW}px">${grid}</div>
      ${body}
    </div>`;

  document.getElementById('gZoom').oninput=e=>{
    GANTT_PXD=parseFloat(e.target.value);
    localStorage.setItem('shk_gpxd',GANTT_PXD);
    renderGantt(gw);
  };
  gw.onclick=e=>{
    const tg=e.target.closest('[data-toggle]');
    if(tg){
      const n=tg.dataset.toggle;
      GANTT_OPEN.has(n)?GANTT_OPEN.delete(n):GANTT_OPEN.add(n);
      renderGantt(gw); return;
    }
    const bar=e.target.closest('.g-bar.clk');
    if(bar) openModal(bar.dataset.sec, bar.dataset.floor, bar.dataset.work);
  };

  // авто-прокрутка к «сегодня» при первом входе в режим
  if(!GANTT_SCROLLED){
    GANTT_SCROLLED=true;
    const sc=gw.closest('.wrap')||gw.parentElement;
    if(sc) sc.scrollLeft=Math.max(0, X(today)-Math.round(sc.clientWidth*0.35));
  }
}

// ── RENDER ────────────────────────────────────────────────────────
function render(){
  const dl = document.getElementById('deadlineInp').value;   // yyyy-mm-dd
  DEADLINE = dl ? new Date(dl+'T23:59:59') : null;
  const board=document.getElementById('board');
  const empty=document.getElementById('emptyState');
  const sub=document.getElementById('subBoards');
  const gw=document.getElementById('ganttWrap');
  if(MODE!=='work') sub.innerHTML='';
  gw.style.display = MODE==='gantt' ? 'block' : 'none';
  if(MODE==='summary'){ gw.innerHTML=''; renderSummary(board,empty); renderSB(); return; }
  if(!CONFIG.sections.length){board.style.display='none';empty.style.display='flex';return;}
  empty.style.display='none';
  if(MODE==='gantt'){
    board.style.display='none'; board.innerHTML='';
    renderGantt(gw);
  } else {
    gw.innerHTML='';
    board.style.display='table';
    MODE==='section' ? renderBySection(board) : renderByWork(board);
  }
  renderProgress();
  renderSB();
}

// ── Сводка: лист «Сводка» из Google как есть ─────────────────────
function renderSummary(board,empty){
  if(!SUMMARY.length){
    board.style.display='none';
    empty.style.display='flex';
    empty.querySelector('.empty-ttl').textContent=t('noSummary');
    return;
  }
  board.style.display='table'; empty.style.display='none';
  const keys=Object.keys(SUMMARY[0]);
  let h='<thead><tr>'+keys.map(k=>
    `<th class="h-work" style="width:auto;min-width:80px;padding:6px 10px;">${esc(k)}</th>`).join('')+'</tr></thead><tbody>';
  SUMMARY.forEach(r=>{
    h+='<tr>'+keys.map(k=>{
      const v=(r[k]===null||r[k]===undefined)?'':String(r[k]);
      let st='padding:6px 10px;font-size:11px;border-bottom:1px solid var(--brd);border-right:1px solid var(--brd);background:var(--bg2);white-space:nowrap;';
      if(/отстав|kašnj|kasnj|lag/i.test(k)){
        const n=parseFloat(v.replace(',','.'));
        if(!isNaN(n)&&n>0) st+='color:#dc2626;font-weight:700;';
        else if(!isNaN(n)&&n<0) st+='color:#16a34a;font-weight:700;';
      }
      return `<td style="${st}">${esc(v)}</td>`;
    }).join('')+'</tr>';
  });
  board.innerHTML=h+'</tbody>';
}

function getSections(){ return CONFIG.sections.filter(s=>FILTER_SEC.size===0||FILTER_SEC.has(String(s['Секция']))); }

function worksFloorFiltered(){
  if(!anyFloorsVisible()) return [];
  return CONFIG.works.filter(w=>w['Единица приемки']==='Этаж секция'&&inGroup(w)&&workSelected(w));
}
function worksSecFiltered(){
  if(!secBlockVisible()) return [];
  return CONFIG.works.filter(w=>w['Единица приемки']==='Секция'&&inGroup(w)&&workSelected(w));
}
function worksSiteFiltered(){
  if(!siteBlockVisible()) return [];
  return CONFIG.works.filter(w=>w['Единица приемки']==='Площадка'&&inGroup(w)&&workSelected(w));
}

function secColCount(s){
  return Math.max(worksFloorFiltered().filter(w=>isWorkApplicable(w,s['Секция'],null)).length,1);
}

function renderBySection(board){
  const sections=getSections();
  const wf=worksFloorFiltered();
  const ws=worksSecFiltered();
  const wsite=worksSiteFiltered();

  let h='<thead><tr>';
  h+=`<th class="corner" rowspan="2"><div class="corner-lbl">${t('floorShort')}</div></th>`;
  sections.forEach((s,si)=>{
    h+=`<th class="h-section" colspan="${secColCount(s)}">${t('sectionPrefix')} ${s['Секция']}</th>`;
    if(si<sections.length-1) h+=`<th class="h-gap" rowspan="2"></th>`;
  });
  h+='</tr><tr>';
  sections.forEach(s=>{
    const aw=wf.filter(w=>isWorkApplicable(w,s['Секция'],null));
    if(!aw.length) h+='<th class="h-work">—</th>';
    else aw.forEach(w=>{h+=thWork(w);});
  });
  h+='</tr></thead><tbody>';

  const abv={},blw={},allA=new Set(),allB=new Set();
  sections.forEach(s=>{
    const a=parseInt(s['Этажи выше 0.000'])||0, b=parseInt(s['Этажи ниже 0.000'])||0;
    abv[s['Секция']]=a; blw[s['Секция']]=b;
    for(let f=a;f>=1;f--) allA.add(f);
    for(let f=1;f<=b;f++) allB.add(f);
  });
  const hasFloor=(s,f)=>f>0?f<=abv[s['Секция']]:Math.abs(f)<=blw[s['Секция']];
  const totCols=sections.reduce((a,s,si)=>a+secColCount(s)+(si<sections.length-1?1:0),0)+1;
  const grpRow=lbl=>`<tr><td class="rh group-hdr" colspan="${totCols}">${lbl}</td></tr>`;

  // Строка этажа; null — если этаж пуст (ни одной применимой работы) и его надо скрыть
  function floorRowHtml(fl){
    if(!floorVisible(fl)) return null;
    const any = sections.some(s=>hasFloor(s,fl)&&wf.some(w=>isWorkApplicable(w,s['Секция'],fl)));
    if(!any) return null;   // пустой этаж скрываем
    let r=`<tr><td class="rh"><div class="rh-inner"><div class="rh-num">${fl}</div><div class="rh-lbl">${t('floorShort')}</div></div></td>`;
    sections.forEach((s,si)=>{
      wf.filter(w=>isWorkApplicable(w,s['Секция'],null)).forEach(w=>{
        r+=!hasFloor(s,fl)||!isWorkApplicable(w,s['Секция'],fl)
          ?'<td class="cell na"></td>'
          :cellHtml(s['Секция'],fl,w['Вид работ']);
      });
      if(si<sections.length-1) r+='<td class="gap-col"></td>';
    });
    return r+'</tr>';
  }

  if(wf.length){
    const rowsA=[...allA].sort((a,b)=>b-a).map(floorRowHtml).filter(Boolean);
    if(rowsA.length) h+=grpRow(t('worksAbove'))+rowsA.join('');
    const rowsB=[...allB].sort((a,b)=>a-b).map(fl=>floorRowHtml(-fl)).filter(Boolean);
    if(rowsB.length) h+=grpRow(t('worksBelow'))+rowsB.join('');
  }

  if(ws.length){
    h+=grpRow(t('workOnSec'));
    ws.forEach(w=>{
      h+=`<tr><td class="rh" style="padding:3px 4px;"><div class="rh-work" title="${esc(workLabel(w))}">${esc(workLabel(w))}</div></td>`;
      sections.forEach((s,si)=>{
        const cols=secColCount(s);
        h+=isWorkApplicable(w,s['Секция'],null)
          ?cellHtml(s['Секция'],'',w['Вид работ'],cols>1?cols:undefined)
          :`<td class="cell na" colspan="${cols}"></td>`;
        if(si<sections.length-1) h+='<td class="gap-col"></td>';
      });
      h+='</tr>';
    });
  }

  // Работы на площадку: одна ячейка на всю ширину (площадка общая, не по секциям)
  if(wsite.length){
    h+=grpRow(t('workOnSite'));
    wsite.forEach(w=>{
      h+=`<tr><td class="rh" style="padding:3px 4px;"><div class="rh-work" title="${esc(workLabel(w))}">${esc(workLabel(w))}</div></td>`;
      h+=cellHtml('','',w['Вид работ'],totCols-1);
      h+='</tr>';
    });
  }

  h+='</tbody>';
  board.innerHTML=h;
}

function renderByWork(board){
  const sections=getSections();
  const colsF   = worksFloorFiltered();
  const colsS   = worksSecFiltered();
  const colsSite= worksSiteFiltered();
  const sub = document.getElementById('subBoards');

  // ── Главная таблица: только поэтажные работы ──
  if(colsF.length){
    board.style.display='table';
    let h=`<thead><tr><th class="corner" rowspan="2"><div class="corner-lbl">${t('floorShort')}</div></th>`;
    h+=`<th class="h-section" colspan="${colsF.length}">${t('byFloorWorks')}</th></tr><tr>`;
    colsF.forEach(w=>{h+=thWork(w);});
    h+='</tr></thead><tbody>';

    sections.forEach(s=>{
      const sec=s['Секция'];
      const above=parseInt(s['Этажи выше 0.000'])||0, below=parseInt(s['Этажи ниже 0.000'])||0;
      const rows=[];
      function floorRow(fl){
        if(!floorVisible(fl)) return;
        if(!colsF.some(w=>isWorkApplicable(w,sec,fl))) return;   // пустой этаж скрываем
        let r=`<tr><td class="rh"><div class="rh-inner"><div class="rh-num">${fl}</div><div class="rh-lbl">${t('floorShort')}</div></div></td>`;
        colsF.forEach(w=>{ r+=!isWorkApplicable(w,sec,fl)?'<td class="cell na"></td>':cellHtml(sec,fl,w['Вид работ']); });
        rows.push(r+'</tr>');
      }
      for(let fl=above;fl>=1;fl--)   floorRow(fl);
      for(let fl=-1;fl>=-below;fl--) floorRow(fl);
      if(rows.length){
        h+=`<tr><td class="rh group-hdr" colspan="${colsF.length+1}">${t('sectionPrefix')} ${sec}</td></tr>`+rows.join('');
      }
    });
    board.innerHTML=h+'</tbody>';
  } else {
    board.style.display='none';
    board.innerHTML='';
  }

  // ── Под-таблицы: работы на секцию и на площадку ──
  let sh='';
  if(colsS.length){
    sh+=`<table class="sub-board"><thead><tr><th class="corner2">${t('workOnSec')}</th>`;
    colsS.forEach(w=>{sh+=thWork(w);});
    sh+='</tr></thead><tbody>';
    sections.forEach(s=>{
      const sec=s['Секция'];
      if(!colsS.some(w=>isWorkApplicable(w,sec,null))) return;
      sh+=`<tr><td class="rh">${t('sectionPrefix')} ${esc(String(sec))}</td>`;
      colsS.forEach(w=>{ sh+=isWorkApplicable(w,sec,null)?cellHtml(sec,'',w['Вид работ']):'<td class="cell na"></td>'; });
      sh+='</tr>';
    });
    sh+='</tbody></table>';
  }
  if(colsSite.length){
    sh+=`<table class="sub-board"><thead><tr><th class="corner2">${t('workOnSite')}</th>`;
    colsSite.forEach(w=>{sh+=thWork(w);});
    sh+='</tr></thead><tbody>';
    sh+=`<tr><td class="rh">${esc(t('onSiteOpt'))}</td>`;
    colsSite.forEach(w=>{ sh+=cellHtml('','',w['Вид работ']); });
    sh+='</tr></tbody></table>';
  }
  sub.innerHTML=sh;
}

function renderProgress(){
  let html='';
  CONFIG.works.filter(w=>w['Единица приемки']==='Этаж секция'&&inGroup(w)).forEach(w=>{
    let total=0,done=0;
    CONFIG.sections.forEach(s=>{
      const a=parseInt(s['Этажи выше 0.000'])||0, b=parseInt(s['Этажи ниже 0.000'])||0;
      for(let f=a;f>=1;f--){ if(!isWorkApplicable(w,s['Секция'],f))continue;total++;if(getPct(s['Секция'],f,w['Вид работ'])===100)done++; }
      for(let f=-1;f>=-b;f--){ if(!isWorkApplicable(w,s['Секция'],f))continue;total++;if(getPct(s['Секция'],f,w['Вид работ'])===100)done++; }
    });
    const pct=total?Math.round(done/total*100):0;
    html+=`<div class="prog-item">
      <div class="prog-lbl">${esc(workLabel(w))}</div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="prog-pct">${pct}%</div>
    </div>`;
  });
  document.getElementById('progWrap').innerHTML=html;
}

// Статусбар: считаем по ВСЕМ применимым ячейкам (как прогресс-бары),
// без деления 1–99% на «в работе»/«частично» — всё это просто «в работе»
function renderSB(){
  let total=0,done=0,inProg=0;
  const count=pct=>{ total++; if(pct===100)done++; else if(pct>0)inProg++; };
  CONFIG.works.forEach(w=>{
    if(w['Единица приемки']==='Этаж секция'){
      CONFIG.sections.forEach(s=>{
        const a=parseInt(s['Этажи выше 0.000'])||0, b=parseInt(s['Этажи ниже 0.000'])||0;
        for(let f=a;f>=1;f--){ if(isWorkApplicable(w,s['Секция'],f)) count(getPct(s['Секция'],f,w['Вид работ'])); }
        for(let f=-1;f>=-b;f--){ if(isWorkApplicable(w,s['Секция'],f)) count(getPct(s['Секция'],f,w['Вид работ'])); }
      });
    } else if(w['Единица приемки']==='Секция'){
      CONFIG.sections.forEach(s=>{
        if(isWorkApplicable(w,s['Секция'],null)) count(getPct(s['Секция'],'',w['Вид работ']));
      });
    } else if(w['Единица приемки']==='Площадка'){
      count(getPct('','',w['Вид работ']));   // одна ячейка на весь объект
    }
  });
  document.getElementById('sbTotal').textContent=total;
  document.getElementById('sbDone').textContent=done;
  document.getElementById('sbInProg').textContent=inProg;
}

// ── MODAL ─────────────────────────────────────────────────────────
function openModal(sec,floor,work){
  CUR={sec,floor,work,key:makeKey(sec,floor,work)};
  const d=getCell(sec,floor,work);
  const wObj=CONFIG.works.find(x=>x['Вид работ']===work);
  document.getElementById('moTitle').textContent = wObj ? workLabel(wObj) : work;
  const flTxt=floor?` · ${t('floorShort')} ${floor}`:'';
  const where = String(sec)==='' ? t('onSiteOpt') : `${t('sectionPrefix')} ${sec}${flTxt}`;
  const sub=[where];
  if(d.factDate) sub.push(`${t('factPrefix')} ${d.factDate}`);
  else if(d.planDate) sub.push(`${t('planPrefix')} ${d.planDate}`);
  document.getElementById('moSub').textContent=sub.join('  ');
  document.getElementById('pctSl').value=d.pct;
  document.getElementById('pctBig').textContent=d.pct+'%';

  // Право редактирования: без пароля (или с ролью Читатель) — только просмотр
  const editable=canEdit(sec, work);
  document.getElementById('pctBlock').style.display = editable?'':'none';
  document.getElementById('saveBtn').style.display  = editable?'':'none';
  const ro=document.getElementById('roNote');
  ro.style.display = editable?'none':'';
  ro.textContent = editable?'':('🔒 '+t('readOnly'));

  document.getElementById('overlay').classList.add('on');
}
function closeModal(e){
  if(e&&e.target!==e.currentTarget)return;
  document.getElementById('overlay').classList.remove('on'); CUR=null;
}
function updPct(v){document.getElementById('pctBig').textContent=v+'%';}
function setPct(v){document.getElementById('pctSl').value=v;document.getElementById('pctBig').textContent=v+'%';}

// ── SAVE ─────────────────────────────────────────────────────────
function saveCell(){
  if(!CUR)return;
  if(!canEdit(CUR.sec, CUR.work)){ toast(t('readOnly'),'err'); return; }
  const pctNew=parseInt(document.getElementById('pctSl').value);
  const pctOld=DATA[CUR.key]?.pct||0;
  const savedCUR={...CUR};
  if(!DATA[savedCUR.key])DATA[savedCUR.key]={found:true,pct:0,updatedAt:'',startDate:'',planDate:'',factDate:'',dev:null};
  DATA[savedCUR.key].pct=pctNew;
  closeModal(); render(); setSt('spin',t('saving'));
  const now=new Date();
  const p=new URLSearchParams({
    action:'update',
    section:String(savedCUR.sec),
    floor:String(savedCUR.floor),
    work:savedCUR.work,
    pct:String(pctNew),
    pass:localStorage.getItem('shk_pass')||'',
    who:OPEN_MODE?(userName||t('anonymous')):''
  });
  fetch(API+'?'+p.toString())
  .then(r=>r.json())
  .then(j=>{
    if(j.error)throw new Error(j.error);
    if(DATA[savedCUR.key])DATA[savedCUR.key].updatedAt=j.updatedAt||'';
    setSt('ok',t('saved')+' · '+now.toLocaleTimeString('ru'));
    toast(t('saved'),'ok');
  })
  .catch(err=>{
    if(DATA[savedCUR.key])DATA[savedCUR.key].pct=pctOld;
    render();
    const m=err&&err.message;
    const msg = m==='no_access'      ? t('wrongPass')
              : m==='read_only'      ? t('readOnly')
              : m==='section_denied' ? t('noSecAccess')
              : m==='work_denied'    ? t('noWorkAccess')
              : t('errorSave');
    setSt('err',msg); toast(msg,'err',4000);
  });
}

// ── HELPERS ──────────────────────────────────────────────────────
function setSt(st,txt){document.getElementById('sdot').className='sync-dot '+st;const el=document.getElementById('stxt');el.className='sync-txt '+st;el.textContent=txt;}
function showLoader(txt){document.getElementById('loader').classList.add('on');document.getElementById('loaderTxt').textContent=txt;}
function hideLoader(){document.getElementById('loader').classList.remove('on');}
function toast(msg,tp,dur){const w=document.getElementById('toasts'),el=document.createElement('div');el.className='toast '+(tp||'inf');el.textContent=msg;w.appendChild(el);setTimeout(()=>el.remove(),dur||2800);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
</script>
